services:
  # Redis for Celery and Channels
  redis:
    image: redis:7-alpine
    container_name: kyood_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./campaign_backend
      dockerfile: Dockerfile
    container_name: kyood_backend
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    volumes:
      - ./campaign_backend/backend:/app
      - media_data:/app/media
      - sqlite_data:/app/db.sqlite3
    ports:
      - "8000:8000"
    environment:
      - DOCKER_ENVIRONMENT=1
      - DEBUG=1
      - SECRET_KEY=django-insecure-c4kd@(3y3q*wi6%rmgdpeoa&yhnu%hq#0t&p4@r6_pb8@5a@_)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      redis:
        condition: service_healthy

  # Celery Worker
  celery_worker:
    build:
      context: ./campaign_backend
      dockerfile: Dockerfile
    container_name: kyood_celery_worker
    command: celery -A core worker -l info
    volumes:
      - ./campaign_backend/backend:/app
      - sqlite_data:/app/db.sqlite3
    environment:
      - DOCKER_ENVIRONMENT=1
      - DEBUG=1
      - SECRET_KEY=django-insecure-c4kd@(3y3q*wi6%rmgdpeoa&yhnu%hq#0t&p4@r6_pb8@5a@_)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./campaign_backend
      dockerfile: Dockerfile
    container_name: kyood_celery_beat
    command: celery -A core beat -l info
    volumes:
      - ./campaign_backend/backend:/app
      - sqlite_data:/app/db.sqlite3
    environment:
      - DOCKER_ENVIRONMENT=1
      - DEBUG=1
      - SECRET_KEY=django-insecure-c4kd@(3y3q*wi6%rmgdpeoa&yhnu%hq#0t&p4@r6_pb8@5a@_)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kyood_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  sqlite_data:
  media_data:
